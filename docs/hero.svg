<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Repo Gardener</title>
  <desc id="desc">Find files the AI forgot to delete. A repository tree shows parser.py kept and parser_v2.py identified as stale.</desc>
  <rect width="1200" height="520" rx="22" fill="#171717"/>
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#2e2e2e" stroke-width="2"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="76" fill="#3ecf8e" font-size="15" font-weight="700" letter-spacing="2.4">OPEN-SOURCE PYTHON TOOL  /  V0.1 ALPHA</text>
    <text x="64" y="170" fill="#fafafa" font-size="68" font-weight="700" letter-spacing="-2.5">AI REPO</text>
    <text x="64" y="240" fill="#fafafa" font-size="68" font-weight="700" letter-spacing="-2.5">GARDENER</text>
    <rect x="64" y="268" width="48" height="4" rx="2" fill="#3ecf8e"/>
    <text x="64" y="322" fill="#b4b4b4" font-size="24" letter-spacing="-0.3">Find files the AI forgot to delete.</text>
    <text x="64" y="360" fill="#898989" font-size="16">Evidence-backed repository cleanup for AI-edited Python codebases.</text>
  </g>

  <g transform="translate(714 58)">
    <rect width="422" height="332" rx="14" fill="#1c1c1c" stroke="#2e2e2e"/>
    <circle cx="24" cy="24" r="4" fill="#898989"/>
    <circle cx="40" cy="24" r="4" fill="#898989"/>
    <circle cx="56" cy="24" r="4" fill="#3ecf8e"/>
    <text x="385" y="29" text-anchor="end" fill="#898989" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.4">DIFF</text>
    <line x1="0" y1="48" x2="422" y2="48" stroke="#2e2e2e"/>

    <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16">
      <text x="28" y="86" fill="#b4b4b4">repo/</text>
      <path d="M43 101V245 M43 126H69 M43 178H69 M43 230H69" fill="none" stroke="#2e2e2e" stroke-width="2"/>
      <text x="79" y="132" fill="#fafafa">app.py</text>
      <text x="79" y="184" fill="#fafafa">parser.py</text>
      <rect x="272" y="162" width="116" height="29" rx="6" fill="#3ecf8e" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.45"/>
      <text x="330" y="182" text-anchor="middle" fill="#3ecf8e" font-size="13" font-weight="700">KEEP</text>
      <text x="79" y="236" fill="#898989" text-decoration="line-through">parser_v2.py</text>
      <rect x="272" y="214" width="116" height="29" rx="6" fill="none" stroke="#2e2e2e"/>
      <text x="330" y="234" text-anchor="middle" fill="#b4b4b4" font-size="13" font-weight="700">STALE</text>
      <text x="28" y="285" fill="#3ecf8e">confidence 100%</text>
      <text x="216" y="285" fill="#b4b4b4">risk 0%</text>
      <text x="28" y="316" fill="#898989">dry-run first · reviewed plan to apply</text>
    </g>
  </g>

  <line x1="64" y1="424" x2="1136" y2="424" stroke="#2e2e2e"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="463" fill="#fafafa" font-size="19" font-weight="700">0 / 59</text>
    <text x="64" y="488" fill="#898989" font-size="12" letter-spacing="1.2">SAFE-DELETE FP</text>

    <text x="286" y="463" fill="#fafafa" font-size="19" font-weight="700">12</text>
    <text x="286" y="488" fill="#898989" font-size="12" letter-spacing="1.2">WHEEL MATRICES</text>

    <text x="486" y="463" fill="#fafafa" font-size="19" font-weight="700">0</text>
    <text x="486" y="488" fill="#898989" font-size="12" letter-spacing="1.2">RUNTIME DEPS</text>

    <text x="1136" y="463" text-anchor="end" fill="#3ecf8e" font-size="19" font-weight="700">0.1.0a11</text>
    <text x="1136" y="488" text-anchor="end" fill="#898989" font-size="12" letter-spacing="1.2">CURRENT PRERELEASE</text>
  </g>
</svg>
