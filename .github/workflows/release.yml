name: Release tested wheel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      wheel: ${{ steps.wheel.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          expected = tag.replace("-alpha.", "a")
          with Path("pyproject.toml").open("rb") as handle:
              actual = tomllib.load(handle)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {actual!r}")
          PY
      - name: Build wheel once
        run: |
          python -m pip install "build==1.3.0"
          python -m build --wheel
      - name: Record wheel name
        id: wheel
        run: echo "name=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheel
          path: dist/${{ steps.wheel.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  test-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-wheel
          path: dist
      - name: Install exact wheel and test dependencies
        run: |
          python -m pip install "dist/${{ needs.build.outputs.wheel }}"
          python -m pip install "pytest==8.4.2" "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Smoke installed commands and portable Skill
        run: |
          repo-gardener --version
          repo-gardener skill-path
          python -c "import subprocess; skill=subprocess.check_output(['repo-gardener','skill-path'], text=True).strip(); raise SystemExit(subprocess.call(['skills-ref','validate',skill]))"
      - name: Test against installed wheel outside source tree
        run: |
          python -c "import os,pathlib,shutil,subprocess,sys; root=pathlib.Path(os.environ['RUNNER_TEMP'])/'repo-gardener-wheel-tests'; shutil.rmtree(root,ignore_errors=True); shutil.copytree('tests',root/'tests'); raise SystemExit(subprocess.call([sys.executable,'-m','pytest','-q','tests'],cwd=root))"
      - name: Dogfood installed CLI
        run: repo-gardener scan . --confidence high --fail-on high

  publish:
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-wheel
          path: dist
      - name: Attest the tested release wheel
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/${{ needs.build.outputs.wheel }}
      - name: Publish the same tested wheel to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/${{ needs.build.outputs.wheel }}" --verify-tag --prerelease --generate-notes --title "$GITHUB_REF_NAME"
