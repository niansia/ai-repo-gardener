[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-gardener"
version = "0.1.0a11"
description = "AI Repo Gardener: evidence-backed garbage collection for AI-edited Python repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AI Repo Gardener contributors" }]
keywords = ["ai", "code-quality", "agent-skills", "dead-code", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/niansia/ai-repo-gardener"
Repository = "https://github.com/niansia/ai-repo-gardener"
Issues = "https://github.com/niansia/ai-repo-gardener/issues"

[project.optional-dependencies]
dev = [
  "pillow==12.2.0",
  "pytest==8.4.2",
  "ruff==0.16.5",
]

[project.scripts]
repo-gardener = "repo_gardener.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/repo-gardener/scripts" }

[tool.setuptools.packages.find]
where = ["skills/repo-gardener/scripts"]
include = ["repo_gardener*"]

[tool.setuptools.data-files]
"share/repo-gardener" = ["skills/repo-gardener/SKILL.md"]
"share/repo-gardener/agents" = ["skills/repo-gardener/agents/*.yaml"]
"share/repo-gardener/references" = ["skills/repo-gardener/references/*.md"]
"share/repo-gardener/scripts" = ["skills/repo-gardener/scripts/run_repo_gardener.py"]
"share/repo-gardener/scripts/repo_gardener" = ["skills/repo-gardener/scripts/repo_gardener/*.py"]
"share/repo-gardener/scripts/repo_gardener/analysis" = ["skills/repo-gardener/scripts/repo_gardener/analysis/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["skills/repo-gardener/scripts"]

[tool.ruff]
exclude = ["tests/fixtures"]
